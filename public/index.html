<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D32">
<title>بلاغ ميداني</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root{padding-top:0}
  .hero{position:relative;color:#fff;min-height:350px;isolation:isolate;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 78px;
    background:linear-gradient(180deg,rgba(7,40,32,.55) 0%,rgba(7,40,32,.35) 40%,rgba(11,61,50,.96) 100%),url("assets/haram.jpg") center 35%/cover no-repeat;
    display:flex;flex-direction:column;justify-content:flex-end}
  .hero::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--lines) center 70%/cover no-repeat;opacity:.55;
    -webkit-mask-image:linear-gradient(180deg,transparent 35%,#000 90%);mask-image:linear-gradient(180deg,transparent 35%,#000 90%)}
  .hero-in{max-width:720px;margin:0 auto;width:100%}
  .frieze{height:1px;margin:16px 0 0;background:linear-gradient(90deg,transparent,rgba(227,207,159,.7) 30%,rgba(255,255,255,.35) 70%,transparent)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand{flex-direction:column;align-items:flex-start;gap:10px}
  .brand img{height:66px;width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
  .org{margin:0;font-size:14px;font-weight:600;color:var(--gold-300);text-shadow:0 1px 4px rgba(0,0,0,.45)}
  .brand h1{font-size:34px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .pulse{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:rgba(11,61,50,.55);backdrop-filter:blur(6px);
    border:1px solid rgba(201,174,122,.35);border-radius:var(--r-md)}
  .pulse div{padding:10px 14px;display:flex;flex-direction:column}
  .pulse div + div{border-inline-start:1px solid rgba(201,174,122,.25)}
  .pulse b{font-family:var(--display);font-size:22px;font-weight:700}
  .pulse span{font-size:12px;color:#D4E2DC}

  main{max-width:720px;margin:-50px auto 0;padding:0 14px 120px;position:relative}
  .step{background:var(--surface);border-radius:var(--r-lg);padding:20px 18px;margin-bottom:12px;border:1px solid var(--line)}
  .step h2{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .n{width:28px;height:28px;border-radius:50%;background:var(--gold-100);color:var(--gold);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
  .lbl{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:14px 0 7px}
  .lbl small{font-weight:400;color:var(--muted)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--marble);border-radius:var(--r-md);padding:4px;gap:4px}
  .seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;cursor:pointer;min-height:44px}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--green-800);box-shadow:0 0 0 1px var(--line)}
  .seg button[data-v="urgent"][aria-pressed="true"]{color:var(--p-urgent)}
  .seg button[data-v="critical"][aria-pressed="true"]{background:var(--p-critical);color:#fff;box-shadow:none}
  .geo{margin-top:14px;width:100%;display:flex;align-items:center;gap:10px;border:1px dashed var(--gold-300);background:var(--gold-100);color:#6E5530;border-radius:var(--r-md);padding:12px 14px;cursor:pointer;font-weight:600;min-height:48px;text-align:start}
  .geo.ok{border-style:solid;border-color:var(--st-closed);background:#E3F1EA;color:var(--st-closed)}
  .route{margin:10px 0 0;font-size:14px;color:var(--green-700);display:flex;gap:8px;align-items:center;background:var(--green-100);padding:9px 12px;border-radius:10px}
  .sug-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 8px}
  .sug-h b{font-size:14px}
  .sug-h span{font-size:12.5px;color:#6E5530;background:var(--gold-100);border-radius:999px;padding:2px 10px;font-weight:600}
  .sug{display:flex;flex-direction:column;gap:8px}
  .sug button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);
    border-radius:var(--r-md);padding:13px 14px;cursor:pointer;font-size:15.5px;font-weight:500;min-height:52px;transition:background .12s,border-color .12s}
  .sug button i{width:24px;height:24px;border-radius:50%;border:2px solid #C9D3CF;flex:none;display:grid;place-items:center;color:#fff}
  .sug button i .ic{width:14px;height:14px;stroke-width:3;opacity:0}
  .sug button[aria-pressed="true"]{border-color:var(--green-700);background:var(--green-100);font-weight:600;color:var(--green-900)}
  .sug button[aria-pressed="true"] i{background:var(--green-700);border-color:var(--green-700)}
  .sug button[aria-pressed="true"] i .ic{opacity:1}
  .photo{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:18px;cursor:pointer;color:var(--green-800);font-weight:600;min-height:64px}
  .photo .ic{width:26px;height:26px}
  .prev{margin-top:16px;position:relative}
  .prev img{width:100%;max-height:320px;object-fit:cover;border-radius:var(--r-md);display:block}
  .prev button{position:absolute;top:10px;inset-inline-start:10px;background:rgba(20,37,31,.8);color:#fff;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
  .err{color:var(--p-critical);font-weight:600;min-height:1.6em;margin:4px 6px}
  .bar{position:fixed;inset:auto 0 0 0;background:rgba(241,244,243,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
  .bar .btn{width:100%;max-width:720px;margin:0 auto;display:flex;font-size:17px;min-height:52px}
  .loading{text-align:center;color:var(--muted);padding:30px}

  .slip-wrap{position:fixed;inset:0;background:rgba(11,61,50,.94) var(--lines) center/cover no-repeat;display:grid;place-items:center;padding:20px;z-index:20}
  .slip{background:var(--surface);border-radius:var(--r-lg);width:min(420px,100%);text-align:center;overflow:hidden;animation:rise .35s ease-out}
  .slip-top{padding:28px 20px 18px}
  .okc{width:56px;height:56px;border-radius:50%;background:#E3F1EA;color:var(--st-closed);display:grid;place-items:center;margin:0 auto 12px}
  .okc .ic{width:30px;height:30px;stroke-width:2.4}
  .slip h2{font-size:20px}
  .slip p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
  .ref{border-top:2px dashed var(--line);padding:18px 20px 22px}
  .ref span{display:block;font-size:13px;color:var(--muted)}
  .ref b{font-family:var(--display);font-size:34px;color:var(--green-800);direction:ltr;display:block}
  .slip .btn{margin:0 20px 22px;width:calc(100% - 40px)}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:420px){.row2{grid-template-columns:1fr}.brand h1{font-size:26px}.pulse b{font-size:19px}.hero{min-height:300px}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <img src="assets/logo-light.png" alt="رئاسة الشؤون الدينية بالمسجد الحرام والمسجد النبوي">
      <div><p class="org" id="org"></p><h1>بلاغ ميداني</h1></div>
    </div>
    <div class="frieze" aria-hidden="true"></div>
    <div class="pulse" aria-live="polite">
      <div><b class="num" id="sToday">–</b><span>بلاغات اليوم</span></div>
      <div><b class="num" id="sClosed">–</b><span>عولجت اليوم</span></div>
      <div><b class="num" id="sAvg">–</b><span>متوسط المعالجة</span></div>
    </div>
  </div>
</header>

<main>
  <p class="loading" id="loading">جارٍ تحميل الخيارات…</p>
  <div id="form" hidden>
    <section class="step" id="stepName">
      <h2><span class="n">1</span>المُبلّغ</h2>
      <label class="lbl" for="rname">اسمك <small id="nameOpt">(اختياري)</small></label>
      <select id="rname" required></select>
      <input id="rnameTxt" placeholder="اكتب اسمك" hidden>
    </section>

    <section class="step" id="stepPlace">
      <h2><span class="n">2</span>أين الملاحظة؟</h2>
      <div class="row2">
        <div><label class="lbl" for="zone">المنطقة</label><select id="zone" required></select></div>
        <div><label class="lbl" for="floor">الدور</label><select id="floor"></select></div>
      </div>
      <div class="row2">
        <div><label class="lbl" for="gate">أقرب باب <small>(اختياري)</small></label><input id="gate" placeholder="رقم الباب أو اسمه"></div>
        <div><label class="lbl" for="spot">وصف المكان <small>(اختياري)</small></label><input id="spot" placeholder="مثال: بجوار حافظات زمزم"></div>
      </div>
      <button type="button" class="geo" id="geoBtn"></button>
    </section>

    <section class="step" id="stepCat">
      <h2><span class="n">3</span>نوع الملاحظة</h2>
      <label class="lbl" for="cat">اختر النوع</label>
      <select id="cat" required></select>
      <p class="route" id="route" hidden></p>
    </section>

    <section class="step">
      <h2><span class="n">4</span>التفاصيل</h2>
      <div id="suggestBox" hidden>
        <div class="sug-h"><b>أوصاف مقترحة</b><span>اضغط على ما ينطبق، أو اكتب بنفسك</span></div>
        <div class="sug" id="suggest" role="group" aria-label="أوصاف مقترحة"></div>
      </div>
      <label class="lbl" for="details" id="detLbl">الوصف</label>
      <textarea id="details" rows="3" maxlength="1500" placeholder="اكتب ما شاهدته باختصار"></textarea>
      <span class="lbl">الأولوية</span>
      <div class="seg" id="prio" role="group" aria-label="الأولوية"></div>
      <label class="photo" id="photoBox"><input type="file" accept="image/*" capture="environment" id="photo" hidden><span id="photoIc"></span><span>التقاط صورة للموقع</span></label>
      <div class="prev" id="prev" hidden><img id="prevImg" alt="صورة البلاغ"><button type="button" id="rmPhoto"></button></div>
    </section>
    <p class="err" id="err" role="alert"></p>
  </div>
</main>

<div class="bar"><button class="btn primary" id="send" type="button" disabled>إرسال البلاغ</button></div>

<div class="slip-wrap" id="done" hidden>
  <div class="slip" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <div class="slip-top"><div class="okc" id="okIc"></div><h2 id="doneTitle">وصل بلاغك</h2><p id="doneTo"></p></div>
    <div class="ref"><span>رقم البلاغ</span><b id="doneRef"></b><span id="doneTime"></span></div>
    <button class="btn primary" id="again" type="button">بلاغ جديد</button>
  </div>
</div>

<script src="assets/config.js"></script>
<script>
(() => {
  const C = window.BN, $ = id => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('k') || '';
  const st = { priority: 'normal', photo: '', lat: null, lng: null, acc: null };
  let OPT = null;
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const opts = (list, ph) => `<option value="" disabled selected>${ph}</option>` + list.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  const fmtDur = ms => { if (ms == null) return '–'; const m = Math.round(ms / 60000); return m < 60 ? m + ' د' : Math.floor(m / 60) + ' س' + (m % 60 ? ' ' + m % 60 + ' د' : ''); };
  const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  $('org').textContent = C.ORG;
  $('photoIc').innerHTML = ic('camera');
  $('rmPhoto').innerHTML = ic('x') + 'حذف الصورة';
  $('okIc').innerHTML = ic('check');

  // يتلوّن الحقل الفارغ بلون باهت
  const markEmpty = el => el.classList.toggle('empty', !el.value);
  document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') markEmpty(e.target); });

  function build() {
    const nm = OPT.name_mode || 'optional';
    // ترقيم الأقسام حسب ظهور خانة الاسم
    if (nm === 'off') { $('stepName').remove(); document.querySelectorAll('.step .n').forEach((n, i) => n.textContent = i + 1); }
    else $('nameOpt').hidden = nm === 'required';
    if (nm === 'off') {}
    else if (OPT.reporters.length) {
      $('rname').innerHTML = opts(OPT.reporters, nm === 'required' ? 'اختر اسمك من القائمة' : 'اختر اسمك (اختياري)');
      const last = store.get('bn_name'); if (OPT.reporters.includes(last)) $('rname').value = last;
    } else { $('rname').hidden = true; $('rnameTxt').hidden = false; $('rnameTxt').value = store.get('bn_name'); }
    $('zone').innerHTML = opts(OPT.zones, 'اختر المنطقة');
    $('floor').innerHTML = opts(OPT.floors, 'اختر الدور');
    $('cat').innerHTML = `<option value="" disabled selected>اختر نوع الملاحظة</option>` + OPT.categories.map(c => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('');
    ['rname', 'zone', 'floor', 'cat'].forEach(id => $(id) && markEmpty($(id)));
    $('loading').hidden = true; $('form').hidden = false; $('send').disabled = false;
  }

  $('cat').addEventListener('change', () => {
    const c = OPT.categories.find(x => x.id === $('cat').value); if (!c) return;
    $('route').hidden = !c.entity_name; $('route').innerHTML = ic('chat') + 'يُحال البلاغ إلى: ' + esc(c.entity_name);
    const has = c.quick && c.quick.length;
    $('suggestBox').hidden = !has;
    $('detLbl').textContent = has ? 'تفاصيل إضافية (اختياري)' : 'الوصف';
    $('details').placeholder = has ? 'أي تفاصيل أخرى لم تذكرها الأوصاف' : 'اكتب ما شاهدته باختصار';
    $('suggest').innerHTML = has ? c.quick.map(q => `<button type="button" aria-pressed="false" data-v="${esc(q)}"><i>${ic('check')}</i>${esc(q)}</button>`).join('') : '';
  });
  $('suggest').addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); });
  const picked = () => [...$('suggest').querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.v);

  // الموقع الجغرافي
  const geoIdle = t => { $('geoBtn').className = 'geo'; $('geoBtn').innerHTML = ic('pin') + `<span>${t || 'إرفاق موقعي الحالي (يساعد الفريق على الوصول)'}</span>`; };
  geoIdle();
  $('geoBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return geoIdle('جهازك لا يدعم تحديد الموقع');
    geoIdle('جارٍ تحديد الموقع…');
    navigator.geolocation.getCurrentPosition(p => {
      st.lat = +p.coords.latitude.toFixed(6); st.lng = +p.coords.longitude.toFixed(6); st.acc = Math.round(p.coords.accuracy);
      $('geoBtn').className = 'geo ok'; $('geoBtn').innerHTML = ic('check') + `<span>تم إرفاق الموقع (دقة ${st.acc} م) — اضغط للتحديث</span>`;
    }, () => geoIdle('لم يُسمح بتحديد الموقع، فعّله من إعدادات المتصفح ثم أعد المحاولة'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });

  // الأولوية
  $('prio').innerHTML = C.PRIORITIES.map(p => `<button type="button" data-v="${p.id}" aria-pressed="${p.id === 'normal'}">${p.label}</button>`).join('');
  $('prio').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.priority = b.dataset.v; $('prio').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });

  // الصورة (تُضغط على الجهاز)
  $('photo').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = URL.createObjectURL(f);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      st.photo = cv.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url);
      $('prevImg').src = st.photo; $('prev').hidden = false; $('photoBox').hidden = true;
    } catch { showErr('تعذّرت قراءة الصورة، التقطها من جديد'); }
    e.target.value = '';
  });
  $('rmPhoto').addEventListener('click', () => { st.photo = ''; $('prev').hidden = true; $('photoBox').hidden = false; });

  // الإرسال
  function showErr(t, el) { $('err').textContent = t; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  const reporter = () => !$('rname') ? '' : OPT.reporters.length ? ($('rname').value || '') : $('rnameTxt').value.trim();
  $('send').addEventListener('click', async () => {
    showErr('');
    if (OPT.name_mode === 'required' && !reporter()) return showErr('اختر اسمك أولاً', $('stepName'));
    if (!$('zone').value) return showErr('اختر المنطقة التي فيها الملاحظة', $('stepPlace'));
    if (!$('cat').value) return showErr('اختر نوع الملاحظة', $('stepCat'));
    const c = OPT.categories.find(x => x.id === $('cat').value);
    if (reporter()) store.set('bn_name', reporter());
    const btn = $('send'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    try {
      const r = await fetch('/api/reports', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
        key, zone: $('zone').value, floor: $('floor').value, gate: $('gate').value, spot: $('spot').value,
        lat: st.lat, lng: st.lng, acc: st.acc, category: c.id, priority: st.priority, details: [...picked(), $('details').value.trim()].filter(Boolean).join('\n'), photo: st.photo, reporter_name: reporter() }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'تعذّر الإرسال');
      $('doneRef').textContent = d.ref;
      $('doneTo').textContent = c.entity_name ? 'أُحيل للمتابعة مع ' + c.entity_name : 'وصل لغرفة المتابعة';
      $('doneTime').textContent = new Intl.DateTimeFormat('ar-SA-u-nu-latn-ca-gregory', { timeZone: 'Asia/Riyadh', dateStyle: 'medium', timeStyle: 'short' }).format(new Date(d.created_at));
      $('done').hidden = false; $('again').focus(); loadStats();
    } catch (e) { showErr(e.message === 'Failed to fetch' ? 'لا يوجد اتصال بالإنترنت، تحقق من الشبكة ثم أعد الإرسال' : e.message); }
    finally { btn.disabled = false; btn.textContent = 'إرسال البلاغ'; }
  });

  $('again').addEventListener('click', () => {
    ['zone', 'floor', 'cat'].forEach(id => { $(id).selectedIndex = 0; markEmpty($(id)); });
    ['gate', 'spot', 'details'].forEach(id => $(id).value = '');
    st.priority = 'normal'; st.photo = ''; $('prio').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'normal'));
    $('route').hidden = $('suggestBox').hidden = true; $('suggest').innerHTML = ''; $('detLbl').textContent = 'الوصف';
    $('prev').hidden = true; $('photoBox').hidden = false; $('done').hidden = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  async function loadStats() {
    try { const d = await (await fetch('/api/stats')).json();
      $('sToday').textContent = d.today ?? '–'; $('sClosed').textContent = d.closed_today ?? '–'; $('sAvg').textContent = fmtDur(d.avg_close_ms); } catch {}
  }
  (async function init() {
    try { OPT = await (await fetch('/api/options')).json(); build(); }
    catch { $('loading').textContent = 'تعذّر تحميل الخيارات، تحقق من الاتصال ثم حدّث الصفحة'; }
  })();
  loadStats(); setInterval(loadStats, 60000);
})();
</script>
</body>
</html>
