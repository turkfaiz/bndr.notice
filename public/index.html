<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D32">
<title>بلاغ ميداني | Bnder Notice</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .band{background:var(--green-900) var(--pattern);color:#fff;padding:22px 18px 70px}
  .band-in{max-width:720px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:52px;height:52px}
  .org{margin:0;font-size:13px;color:var(--gold-300)}
  .brand h1{font-size:30px;font-weight:800;letter-spacing:0}
  .pulse{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid rgba(201,174,122,.35)}
  .pulse div{padding:12px 4px 0;display:flex;flex-direction:column}
  .pulse div + div{border-inline-start:1px solid rgba(201,174,122,.25);padding-inline-start:14px}
  .pulse b{font-family:var(--display);font-size:24px;font-weight:700;color:#fff}
  .pulse span{font-size:12.5px;color:#C7D6D0}

  main{max-width:720px;margin:-48px auto 0;padding:0 14px 120px}
  .step{background:var(--surface);border-radius:var(--r-lg);padding:20px 18px;margin-bottom:12px;border:1px solid var(--line)}
  .step h2{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .step h2 small{font-family:var(--font);font-weight:400;font-size:13px;color:var(--muted)}
  .n{width:28px;height:28px;border-radius:50%;background:var(--gold-100);color:var(--gold);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
  .lbl{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:16px 0 8px}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--marble);border-radius:var(--r-md);padding:4px;gap:4px}
  .seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;cursor:pointer;min-height:44px}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--green-800);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
  .prio button[data-v="urgent"][aria-pressed="true"]{color:var(--p-urgent)}
  .prio button[data-v="critical"][aria-pressed="true"]{background:var(--p-critical);color:#fff;box-shadow:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 .lbl{margin-top:16px}
  .geo{margin-top:14px;width:100%;display:flex;align-items:center;gap:10px;border:1px dashed var(--gold-300);background:var(--gold-100);color:#6E5530;border-radius:var(--r-md);padding:12px 14px;cursor:pointer;font-weight:600;min-height:48px}
  .geo.ok{border-style:solid;border-color:var(--st-closed);background:#E3F1EA;color:var(--st-closed)}
  .hint{font-size:13px;color:var(--muted);margin:6px 0 0}

  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 12px;cursor:pointer;font-weight:600;min-height:86px}
  .cat .ic{width:24px;height:24px;color:var(--green-700)}
  .cat[aria-pressed="true"]{border-color:var(--green-800);background:var(--green-800);color:#fff}
  .cat[aria-pressed="true"] .ic{color:var(--gold-300)}
  .route{margin:12px 0 0;font-size:14px;color:var(--green-700);display:flex;gap:8px;align-items:center}

  .quick{margin-bottom:10px}
  .quick .chip{background:var(--marble);border-color:transparent}
  .quick .chip[aria-pressed="true"]{background:var(--green-100);color:var(--green-800);border-color:var(--green-700)}
  .photo{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:var(--r-md);padding:18px;cursor:pointer;color:var(--green-800);font-weight:600;min-height:64px}
  .photo .ic{width:26px;height:26px}
  .prev{margin-top:16px;position:relative}
  .prev img{width:100%;max-height:320px;object-fit:cover;border-radius:var(--r-md);display:block}
  .prev button{position:absolute;top:10px;inset-inline-start:10px;background:rgba(20,37,31,.8);color:#fff;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}

  .err{color:var(--p-critical);font-weight:600;min-height:1.6em;margin:4px 6px}
  .bar{position:fixed;inset:auto 0 0 0;background:rgba(241,244,243,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
  .bar .btn{width:100%;max-width:720px;margin:0 auto;display:flex;font-size:17px;min-height:52px}

  .slip-wrap{position:fixed;inset:0;background:rgba(11,61,50,.92) var(--pattern);display:grid;place-items:center;padding:20px;z-index:20}
  .slip{background:var(--surface);border-radius:var(--r-lg);width:min(420px,100%);text-align:center;overflow:hidden;animation:rise .35s ease-out}
  .slip-top{padding:28px 20px 18px}
  .slip-top .okc{width:56px;height:56px;border-radius:50%;background:#E3F1EA;color:var(--st-closed);display:grid;place-items:center;margin:0 auto 12px}
  .slip-top .okc .ic{width:30px;height:30px;stroke-width:2.4}
  .slip h2{font-size:20px}
  .slip p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
  .ref{border-top:2px dashed var(--line);padding:18px 20px 22px}
  .ref span{display:block;font-size:13px;color:var(--muted)}
  .ref b{font-family:var(--display);font-size:34px;color:var(--green-800);direction:ltr;display:block}
  .slip .btn{margin:0 20px 22px;width:calc(100% - 40px)}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  @media (max-width:420px){.row2{grid-template-columns:1fr}.brand h1{font-size:26px}.pulse b{font-size:20px}}
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div class="brand">
      <img src="assets/logo.svg" alt="">
      <div><p class="org" id="org"></p><h1>بلاغ ميداني</h1></div>
    </div>
    <div class="pulse" aria-live="polite">
      <div><b class="num" id="sToday">–</b><span>بلاغات اليوم</span></div>
      <div><b class="num" id="sClosed">–</b><span>عولجت اليوم</span></div>
      <div><b class="num" id="sAvg">–</b><span>متوسط المعالجة</span></div>
    </div>
  </div>
</header>

<main>
  <section class="step" id="stepPlace">
    <h2><span class="n">1</span>أين الملاحظة؟</h2>
    <div class="seg" id="mosques" role="group" aria-label="المسجد"></div>
    <span class="lbl">المنطقة</span>
    <div class="chips" id="zones"></div>
    <span class="lbl">الدور</span>
    <div class="chips" id="floors"></div>
    <div class="row2">
      <div><label class="lbl" for="gate">أقرب باب</label><input id="gate" placeholder="رقم الباب أو اسمه"></div>
      <div><label class="lbl" for="spot">وصف المكان</label><input id="spot" placeholder="مثال: بجوار حافظات زمزم"></div>
    </div>
    <button type="button" class="geo" id="geoBtn"></button>
  </section>

  <section class="step" id="stepCat">
    <h2><span class="n">2</span>نوع الملاحظة</h2>
    <div class="cats" id="cats"></div>
    <p class="route" id="route" hidden></p>
  </section>

  <section class="step">
    <h2><span class="n">3</span>التفاصيل</h2>
    <div class="chips quick" id="quick"><p class="hint">اختر نوع الملاحظة لتظهر لك أوصاف جاهزة</p></div>
    <label class="lbl" for="details" style="margin-top:4px">الوصف</label>
    <textarea id="details" rows="3" maxlength="1500" placeholder="اكتب ما شاهدته باختصار"></textarea>
    <span class="lbl">الأولوية</span>
    <div class="seg prio" id="prio" role="group" aria-label="الأولوية"></div>
    <label class="photo" id="photoBox"><input type="file" accept="image/*" capture="environment" id="photo" hidden><span id="photoIc"></span><span>التقاط صورة للموقع</span></label>
    <div class="prev" id="prev" hidden><img id="prevImg" alt="صورة البلاغ"><button type="button" id="rmPhoto"></button></div>
  </section>

  <section class="step">
    <h2><span class="n">4</span>بيانات المُبلّغ <small>اختياري</small></h2>
    <div class="row2">
      <div><label class="lbl" for="rname" style="margin-top:0">الاسم</label><input id="rname" autocomplete="name"></div>
      <div><label class="lbl" for="rphone" style="margin-top:0">الجوال</label><input id="rphone" type="tel" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" autocomplete="tel"></div>
    </div>
  </section>
  <p class="err" id="err" role="alert"></p>
</main>

<div class="bar"><button class="btn primary" id="send" type="button">إرسال البلاغ</button></div>

<div class="slip-wrap" id="done" hidden>
  <div class="slip" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <div class="slip-top">
      <div class="okc" id="okIc"></div>
      <h2 id="doneTitle">وصل بلاغك</h2>
      <p id="doneTo"></p>
    </div>
    <div class="ref"><span>رقم البلاغ</span><b id="doneRef"></b><span id="doneTime"></span></div>
    <button class="btn primary" id="again" type="button">بلاغ جديد</button>
  </div>
</div>

<script src="assets/config.js"></script>
<script>
(() => {
  const C = window.BN, $ = id => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('k') || '';
  const st = { mosque: C.MOSQUES[0].id, zone: '', floor: '', category: '', priority: 'normal', photo: '', lat: null, lng: null, acc: null };
  const fmtDur = ms => {
    if (ms == null) return '–';
    const m = Math.round(ms / 60000);
    return m < 60 ? m + ' د' : (Math.floor(m / 60) + ' س' + (m % 60 ? ' ' + (m % 60) + ' د' : ''));
  };
  const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  $('org').textContent = C.ORG;
  $('photoIc').innerHTML = ic('camera');
  $('rmPhoto').innerHTML = ic('x') + 'حذف الصورة';
  $('okIc').innerHTML = ic('check');
  $('rname').value = store.get('bn_name');
  $('rphone').value = store.get('bn_phone');

  const press = (wrap, val, attr = 'v') =>
    wrap.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] === val ? 'true' : 'false'));

  // ---- المسجد / المنطقة / الدور ----
  function renderMosques() {
    $('mosques').innerHTML = C.MOSQUES.map(m => `<button type="button" data-v="${m.id}">${m.name}</button>`).join('');
    press($('mosques'), st.mosque);
  }
  function renderPlace() {
    const m = C.MOSQUES.find(x => x.id === st.mosque);
    $('zones').innerHTML = m.zones.map(z => `<button type="button" class="chip" data-v="${z}">${z}</button>`).join('');
    $('floors').innerHTML = m.floors.map(f => `<button type="button" class="chip" data-v="${f}">${f}</button>`).join('');
    press($('zones'), st.zone); press($('floors'), st.floor);
  }
  $('mosques').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.mosque = b.dataset.v; st.zone = ''; st.floor = '';
    press($('mosques'), st.mosque); renderPlace();
  });
  $('zones').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.zone = st.zone === b.dataset.v ? '' : b.dataset.v; press($('zones'), st.zone); });
  $('floors').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.floor = st.floor === b.dataset.v ? '' : b.dataset.v; press($('floors'), st.floor); });

  // ---- الموقع الجغرافي ----
  const geoIdle = () => { $('geoBtn').className = 'geo'; $('geoBtn').innerHTML = ic('pin') + '<span>إرفاق موقعي الحالي (يساعد الفريق على الوصول)</span>'; };
  geoIdle();
  $('geoBtn').addEventListener('click', () => {
    if (!navigator.geolocation) { $('geoBtn').innerHTML = ic('pin') + '<span>جهازك لا يدعم تحديد الموقع</span>'; return; }
    $('geoBtn').innerHTML = ic('pin') + '<span>جارٍ تحديد الموقع…</span>';
    navigator.geolocation.getCurrentPosition(p => {
      st.lat = +p.coords.latitude.toFixed(6); st.lng = +p.coords.longitude.toFixed(6); st.acc = Math.round(p.coords.accuracy);
      $('geoBtn').className = 'geo ok';
      $('geoBtn').innerHTML = ic('check') + `<span>تم إرفاق الموقع (دقة ${st.acc} م) — اضغط للتحديث</span>`;
    }, () => {
      geoIdle();
      $('geoBtn').innerHTML = ic('pin') + '<span>لم يُسمح بتحديد الموقع، فعّله من إعدادات المتصفح ثم أعد المحاولة</span>';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });

  // ---- التصنيف + الردود السريعة ----
  $('cats').innerHTML = C.CATEGORIES.map(c => `<button type="button" class="cat" data-v="${c.id}">${ic(c.icon)}<span>${c.label}</span></button>`).join('');
  const entityName = id => C.ENTITIES[id] || '';
  $('cats').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.category = b.dataset.v; press($('cats'), st.category);
    const c = C.CATEGORIES.find(x => x.id === st.category);
    $('route').hidden = false; $('route').innerHTML = ic('chat') + 'يصل البلاغ إلى: ' + entityName(c.entity);
    $('quick').innerHTML = c.quick.map(q => `<button type="button" class="chip" data-v="${q}">${q}</button>`).join('');
    syncQuick();
  });
  const lines = () => $('details').value.split('\n').map(x => x.trim()).filter(Boolean);
  function syncQuick() { const have = lines(); $('quick').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', have.includes(b.dataset.v) ? 'true' : 'false')); }
  $('quick').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    let l = lines(); const v = b.dataset.v;
    l = l.includes(v) ? l.filter(x => x !== v) : [...l, v];
    $('details').value = l.join('\n'); syncQuick();
  });
  $('details').addEventListener('input', syncQuick);

  // ---- الأولوية ----
  $('prio').innerHTML = C.PRIORITIES.map(p => `<button type="button" data-v="${p.id}">${p.label}</button>`).join('');
  press($('prio'), st.priority);
  $('prio').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.priority = b.dataset.v; press($('prio'), st.priority); });

  // ---- الصورة (تُضغط على الجهاز قبل الإرسال) ----
  $('photo').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const url = URL.createObjectURL(f);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      st.photo = cv.toDataURL('image/jpeg', 0.72);
      URL.revokeObjectURL(url);
      $('prevImg').src = st.photo; $('prev').hidden = false; $('photoBox').hidden = true;
    } catch { showErr('تعذّرت قراءة الصورة، التقطها من جديد'); }
    e.target.value = '';
  });
  $('rmPhoto').addEventListener('click', () => { st.photo = ''; $('prev').hidden = true; $('photoBox').hidden = false; });

  // ---- الإرسال ----
  function showErr(t, el) { $('err').textContent = t; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  $('send').addEventListener('click', async () => {
    showErr('');
    if (!st.zone) return showErr('اختر المنطقة التي فيها الملاحظة', $('stepPlace'));
    if (!st.category) return showErr('اختر نوع الملاحظة', $('stepCat'));
    const c = C.CATEGORIES.find(x => x.id === st.category);
    const payload = {
      key, mosque: st.mosque, zone: st.zone, floor: st.floor, gate: $('gate').value, spot: $('spot').value,
      lat: st.lat, lng: st.lng, acc: st.acc, category: c.id, category_label: c.label, entity_id: c.entity,
      priority: st.priority, details: $('details').value, photo: st.photo,
      reporter_name: $('rname').value, reporter_phone: $('rphone').value
    };
    store.set('bn_name', $('rname').value); store.set('bn_phone', $('rphone').value);
    const btn = $('send'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    try {
      const r = await fetch('/api/reports', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'تعذّر الإرسال');
      $('doneRef').textContent = d.ref;
      $('doneTo').textContent = 'أُحيل للمتابعة مع ' + entityName(c.entity);
      $('doneTime').textContent = new Intl.DateTimeFormat('ar-SA-u-nu-latn-ca-gregory', { timeZone: 'Asia/Riyadh', dateStyle: 'medium', timeStyle: 'short' }).format(new Date(d.created_at));
      $('done').hidden = false; $('again').focus();
      loadStats();
    } catch (e) {
      showErr(e.message === 'Failed to fetch' ? 'لا يوجد اتصال بالإنترنت، تحقق من الشبكة ثم أعد الإرسال' : e.message);
    } finally { btn.disabled = false; btn.textContent = 'إرسال البلاغ'; }
  });

  $('again').addEventListener('click', () => {
    Object.assign(st, { zone: '', floor: '', category: '', priority: 'normal', photo: '' });
    ['gate', 'spot', 'details'].forEach(id => $(id).value = '');
    renderPlace(); press($('cats'), ''); press($('prio'), 'normal');
    $('route').hidden = true; $('quick').innerHTML = '<p class="hint">اختر نوع الملاحظة لتظهر لك أوصاف جاهزة</p>';
    $('prev').hidden = true; $('photoBox').hidden = false; $('done').hidden = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---- إحصائية الواجهة ----
  async function loadStats() {
    try {
      const d = await (await fetch('/api/stats')).json();
      $('sToday').textContent = d.today ?? '–'; $('sClosed').textContent = d.closed_today ?? '–'; $('sAvg').textContent = fmtDur(d.avg_close_ms);
    } catch {}
  }

  renderMosques(); renderPlace(); loadStats();
  setInterval(loadStats, 60000);
})();
</script>
</body>
</html>
